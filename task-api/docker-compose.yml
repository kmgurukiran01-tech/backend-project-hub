services:

  postgres:
    image: postgres:16
    container_name: task-postgres
    restart: always

    environment:
      POSTGRES_USER: guru
      POSTGRES_PASSWORD: MyStrongPassword123
      POSTGRES_DB: task_database

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


  redis:
    image: redis:7
    container_name: task-redis
    restart: always

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data


volumes:
  postgres_data:
  redis_data: